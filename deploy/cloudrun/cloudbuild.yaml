# Builds the Cloud Run image and pushes it to Artifact Registry in the same
# region as the services. Run by deploy.sh:
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml \
#     --substitutions=_IMAGE=<region>-docker.pkg.dev/<project>/<repo>/api:<tag> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'deploy/cloudrun/Dockerfile', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
